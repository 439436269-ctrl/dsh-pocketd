name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -v

      - name: build
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          GOOS=linux  GOARCH=amd64 go build -o /dev/null .
